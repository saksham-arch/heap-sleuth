[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heap-sleuth"
version = "0.1.0"
description = "Inspectable heap snapshot comparisons"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
heap-sleuth = "heap_sleuth.__main__:main"

